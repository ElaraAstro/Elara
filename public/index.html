<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#1a1330" />
<title>Elara</title>
<link rel="manifest" href="/manifest.json" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --night-deep: #15102a;
    --night-mid: #241a42;
    --night-violet: #3a2a63;
    --lavender: #c9aee0;
    --rose: #e3b8cf;
    --starlight: #f0d9a3;
    --ink: #f3eef9;
    --ink-dim: #b8aed1;
    --bubble-user: #4a3470;
    --bubble-elara: rgba(255,255,255,0.06);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--night-deep);
    color: var(--ink);
    font-family: 'Karla', sans-serif;
    overscroll-behavior: none;
  }

  #stars {
    position: fixed;
    inset: 0;
    z-index: 0;
    background: radial-gradient(ellipse 120% 80% at 50% -10%, var(--night-violet) 0%, var(--night-mid) 45%, var(--night-deep) 100%);
    overflow: hidden;
  }

  .star {
    position: absolute;
    background: var(--ink);
    border-radius: 50%;
    opacity: 0.5;
    animation: twinkle ease-in-out infinite;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.15; transform: scale(1); }
    50% { opacity: 0.85; transform: scale(1.4); }
  }

  @media (prefers-reduced-motion: reduce) {
    .star { animation: none; opacity: 0.4; }
  }

  #app {
    position: relative;
    z-index: 1;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  #onboarding {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 28px;
    text-align: center;
    animation: fadeIn 0.8s ease;
  }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .moon-mark {
    font-size: 38px;
    margin-bottom: 18px;
    filter: drop-shadow(0 0 18px rgba(240, 217, 163, 0.35));
  }

  #onboarding h1 {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-style: italic;
    font-size: 34px;
    margin: 0 0 10px;
    letter-spacing: 0.3px;
    color: var(--ink);
  }

  #onboarding p.sub {
    font-size: 15px;
    color: var(--ink-dim);
    max-width: 280px;
    line-height: 1.55;
    margin: 0 0 36px;
  }

  .field-group {
    width: 100%;
    max-width: 320px;
    text-align: left;
    margin-bottom: 18px;
  }

  .field-group label {
    display: block;
    font-size: 12.5px;
    color: var(--lavender);
    margin-bottom: 7px;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    font-weight: 600;
  }

  .field-group input,
  .field-group select {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 14px;
    padding: 14px 16px;
    font-size: 16px;
    color: var(--ink);
    font-family: 'Karla', sans-serif;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
    appearance: none;
  }

  .field-group input::placeholder { color: rgba(243,238,249,0.35); }

  .field-group input:focus,
  .field-group select:focus {
    border-color: var(--lavender);
    background: rgba(255,255,255,0.08);
  }

  #startBtn {
    margin-top: 10px;
    width: 100%;
    max-width: 320px;
    background: linear-gradient(135deg, var(--rose), var(--starlight));
    border: none;
    border-radius: 16px;
    padding: 15px 0;
    font-size: 16px;
    font-weight: 600;
    color: #2a1d40;
    font-family: 'Karla', sans-serif;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 8px 24px rgba(227, 184, 207, 0.25);
  }

  #startBtn:active { transform: scale(0.97); }
  #startBtn:disabled { opacity: 0.5; cursor: not-allowed; }

  #chatHeader {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 16px 20px 14px;
    flex-shrink: 0;
  }

  #chatHeader .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--starlight);
    box-shadow: 0 0 8px var(--starlight);
  }

  #chatHeader .name {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 19px;
    color: var(--ink);
  }

  #chatScreen {
    display: none;
    flex: 1;
    flex-direction: column;
    min-height: 0;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 6px 18px 14px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    -webkit-overflow-scrolling: touch;
  }

  .msg {
    max-width: 82%;
    padding: 12px 16px;
    border-radius: 20px;
    font-size: 15.5px;
    line-height: 1.5;
    animation: rise 0.35s ease;
    word-wrap: break-word;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.elara {
    align-self: flex-start;
    background: var(--bubble-elara);
    border: 1px solid rgba(255,255,255,0.08);
    border-bottom-left-radius: 6px;
    color: var(--ink);
  }

  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
    border-bottom-right-radius: 6px;
    color: var(--ink);
  }

  .typing {
    align-self: flex-start;
    display: flex;
    gap: 4px;
    padding: 14px 18px;
    background: var(--bubble-elara);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    border-bottom-left-radius: 6px;
  }

  .typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--lavender);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  #inputBar {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 10px 14px;
    padding-bottom: max(14px, env(safe-area-inset-bottom));
    flex-shrink: 0;
    background: linear-gradient(to top, var(--night-deep) 60%, transparent);
  }

  #textInput {
    flex: 1;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 22px;
    padding: 12px 18px;
    font-size: 15.5px;
    color: var(--ink);
    font-family: 'Karla', sans-serif;
    outline: none;
    resize: none;
    max-height: 110px;
    line-height: 1.4;
  }

  #textInput::placeholder { color: rgba(243,238,249,0.35); }
  #textInput:focus { border-color: var(--lavender); }

  #sendBtn {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, var(--rose), var(--starlight));
    color: #2a1d40;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s ease;
  }

  #sendBtn:active { transform: scale(0.9); }
  #sendBtn:disabled { opacity: 0.4; cursor: not-allowed; }

  .crisis-note {
    font-size: 11.5px;
    color: var(--ink-dim);
    text-align: center;
    padding: 0 24px 8px;
    line-height: 1.4;
    opacity: 0.7;
  }
</style>
</head>
<body>

<div id="stars"></div>

<div id="app">

  <div id="onboarding">
    <div class="moon-mark">🌙</div>
    <h1>elara</h1>
    <p class="sub">a quiet place to talk about love, heartbreak, and everything the heart hasn't said out loud yet.</p>

    <div class="field-group">
      <label for="nameInput">your name</label>
      <input id="nameInput" type="text" placeholder="what should i call you?" maxlength="30" autocomplete="off" />
    </div>

    <div class="field-group">
      <label for="signInput">your star sign <span style="opacity:0.6; text-transform:none;">(optional)</span></label>
      <select id="signInput">
        <option value="">prefer not to say</option>
        <option>Aries</option><option>Taurus</option><option>Gemini</option>
        <option>Cancer</option><option>Leo</option><option>Virgo</option>
        <option>Libra</option><option>Scorpio</option><option>Sagittarius</option>
        <option>Capricorn</option><option>Aquarius</option><option>Pisces</option>
      </select>
    </div>

    <button id="startBtn" disabled>begin</button>
  </div>

  <div id="chatScreen">
    <div id="chatHeader">
      <div class="dot"></div>
      <div class="name">elara</div>
    </div>
    <div id="messages"></div>
    <div class="crisis-note">elara offers emotional support, not therapy. if you're in crisis, please reach out to Tele-MANAS at 14416.</div>
    <div id="inputBar">
      <textarea id="textInput" placeholder="tell elara what's on your mind..." rows="1"></textarea>
      <button id="sendBtn">↑</button>
    </div>
  </div>

</div>

<script>
  const starsContainer = document.getElementById('stars');
  const STAR_COUNT = 60;
  for (let i = 0; i < STAR_COUNT; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2 + 1;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.top = Math.random() * 100 + '%';
    s.style.left = Math.random() * 100 + '%';
    s.style.animationDuration = (Math.random() * 3 + 2.5) + 's';
    s.style.animationDelay = (Math.random() * 3) + 's';
    starsContainer.appendChild(s);
  }

  let userName = '';
  let userSign = '';
  let conversation = [];

  const onboarding = document.getElementById('onboarding');
  const chatScreen = document.getElementById('chatScreen');
  const chatHeader = document.getElementById('chatHeader');
  const nameInput = document.getElementById('nameInput');
  const signInput = document.getElementById('signInput');
  const startBtn = document.getElementById('startBtn');
  const messagesEl = document.getElementById('messages');
  const textInput = document.getElementById('textInput');
  const sendBtn = document.getElementById('sendBtn');

  nameInput.addEventListener('input', () => {
    startBtn.disabled = nameInput.value.trim().length === 0;
  });

  nameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !startBtn.disabled) startChat();
  });

  startBtn.addEventListener('click', startChat);

  function startChat() {
    userName = nameInput.value.trim();
    userSign = signInput.value;
    if (!userName) return;
    onboarding.style.display = 'none';
    chatScreen.style.display = 'flex';
    chatHeader.style.display = 'flex';
    sendToElara(true);
  }

  function addMessage(text, sender) {
    const div = document.createElement('div');
    div.className = 'msg ' + sender;
    div.textContent = text;
    messagesEl.appendChild(div);
    scrollToBottom();
    return div;
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'typing';
    div.id = 'typingIndicator';
    div.innerHTML = '<span></span><span></span><span></span>';
    messagesEl.appendChild(div);
    scrollToBottom();
  }

  function hideTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  function scrollToBottom() {
    requestAnimationFrame(() => {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });
  }

  textInput.addEventListener('input', () => {
    textInput.style.height = 'auto';
    textInput.style.height = Math.min(textInput.scrollHeight, 110) + 'px';
  });

  textInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  });

  sendBtn.addEventListener('click', handleSend);

  function handleSend() {
    const text = textInput.value.trim();
    if (!text) return;
    addMessage(text, 'user');
    conversation.push({ role: 'user', content: text });
    textInput.value = '';
    textInput.style.height = 'auto';
    sendToElara(false);
  }

  async function sendToElara(isOpening) {
    sendBtn.disabled = true;
    showTyping();
    const payloadMessages = isOpening
      ? [{ role: 'user', content: '(say hello and open the conversation gently)' }]
      : conversation;

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: payloadMessages, name: userName, sign: userSign }),
      });
      const data = await res.json();
      hideTyping();
      if (!res.ok || data.error) {
        addMessage("hmm, i'm having a little trouble hearing you right now. could you try again in a moment?", 'elara');
        sendBtn.disabled = false;
        return;
      }
      addMessage(data.reply, 'elara');
      conversation.push({ role: 'assistant', content: data.reply });
    } catch (err) {
      hideTyping();
      addMessage("hmm, i'm having a little trouble hearing you right now. could you try again in a moment?", 'elara');
    } finally {
      sendBtn.disabled = false;
      textInput.focus();
    }
  }
</script>

</body>
</html>
